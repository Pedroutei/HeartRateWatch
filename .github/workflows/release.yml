name: Build release APKs

# The repo doesn't have a committed Gradle wrapper (gradlew/gradlew.bat/gradle-wrapper.jar), so
# this uses gradle/actions/setup-gradle to provision the exact Gradle version pinned in
# gradle/wrapper/gradle-wrapper.properties and invokes `gradle` directly instead of `./gradlew`.
#
# Two ways to get an installable build:
#   - Push a tag like "v1.0" -> creates a real GitHub Release named after the tag.
#   - Run this workflow manually (Actions tab -> Build release APKs -> Run workflow) -> updates
#     a rolling "latest-build" pre-release, so there's always a one-tap link to what's currently
#     on the branch without needing to version-tag every try.
#
# Both phone and watch are debug-signed (self-signed with a keystore Gradle generates on first
# build) -- fine for sideloading onto your own devices, not something you'd publish.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JetBrains JDK 25, not Temurin 21: gradle/gradle-daemon-jvm.properties (generated by Android
      # Studio) pins the Gradle daemon to exactly that, and when the runner doesn't already have it
      # Gradle tries to download it from foojay.io -- which started failing with HTTP 400 once the
      # runner's cached copy expired. Providing it here means no download is needed.
      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs
        run: gradle :mobile:assembleDebug :wear:assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p release-apks
          cp mobile/build/outputs/apk/debug/*.apk release-apks/PulseGuard-phone.apk
          cp wear/build/outputs/apk/debug/*.apk release-apks/PulseGuard-watch.apk

      - name: Create tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*
          generate_release_notes: true

      # The release action updates the release's files but never moves an existing tag, so without
      # this "latest-build" stays on whichever commit first created it -- and GitHub builds the
      # release's Source code zip/tar.gz from the tag, so those went stale too.
      - name: Move the rolling tag to this commit
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag -f latest-build "$GITHUB_SHA"
          git push -f origin latest-build

      - name: Update rolling "latest build" release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Latest build (${{ github.sha }})"
          prerelease: true
          files: release-apks/*
